_schema-version: 3.3.0
ID: SampleDeploy
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: SampleDeploy-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: sampledeployxsuaa
      - name: SampleDeploy-db
      - name: SampleDeploy-destination

  - name: SampleDeploy-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: SampleDeploy-db
  - name: SampleDeploy
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sampledeployxsuaa
      - name: SampleDeploy-html5-runtime
      - name: SampleDeploy-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: SampleDeploy-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: SampleDeployfiori
          artifacts:
            - fiori.zip
          target-path: app/
    requires:
      - name: sampledeployxsuaa
      - name: srv-api
      - name: SampleDeploy-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            HTML5.ForwardAuthToken: true
            HTML5.DynamicDestination: true

  - name: SampleDeployfiori
    type: html5
    path: app/fiori
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: SampleDeploy-destinations
    type: com.sap.application.content
    requires:
      - name: sampledeployxsuaa
        parameters:
          service-key:
            name: sampledeployxsuaa-key
      - name: SampleDeploy-html5-repo-host
        parameters:
          service-key:
            name: SampleDeploy-html5-repo-host-key
      - name: srv-api
      - name: SampleDeploy-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: SampleDeploy-html5-repository
              ServiceInstanceName: SampleDeploy-html5-repo-host
              ServiceKeyName: SampleDeploy-html5-repo-host-key
              sap.cloud.service: SampleDeploy.service
            - Name: sampledeployxsuaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: sampledeployxsuaa
              ServiceKeyName: sampledeployxsuaa-key
              sap.cloud.service: SampleDeploy.service

resources:
  - name: sampledeployxsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: SampleDeploy-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Viewer (SampleDeploy ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Viewer'
          - name: 'admin (SampleDeploy ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
    requires:
      - name: app-api
  - name: SampleDeploy-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      
  - name: SampleDeploy-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: SampleDeploy-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: SampleDeploy-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
