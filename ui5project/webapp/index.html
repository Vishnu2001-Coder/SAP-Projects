<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>App Title</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"               
        data-sap-ui-resource-roots='{                               
            "ui5project": "./"
        }'                                                            // Resoursce roots is targeting the webapp , we just give a alias name
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"     // component support or put index.js
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="ui5project"
        data-id="container"
        data-settings='{"id" : "ui5project"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
